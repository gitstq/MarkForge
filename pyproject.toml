[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markforge"
version = "1.0.0"
description = "🔨 MarkForge - Lightweight Markdown Intelligent Conversion Engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "MarkForge Team", email = "markforge@example.com"}
]
keywords = [
    "markdown",
    "converter",
    "html",
    "pdf",
    "docx",
    "pptx",
    "document",
    "cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities"
]
dependencies = []

[project.optional-dependencies]
pdf = ["weasyprint>=60.0"]
docx = ["python-docx>=1.0.0"]
pptx = ["python-pptx>=0.6.21"]
all = ["weasyprint>=60.0", "python-docx>=1.0.0", "python-pptx>=0.6.21"]
dev = ["pytest>=7.0", "black>=23.0", "flake8>=6.0"]

[project.scripts]
markforge = "markforge.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/MarkForge"
Documentation = "https://github.com/gitstq/MarkForge#readme"
Repository = "https://github.com/gitstq/MarkForge"
Issues = "https://github.com/gitstq/MarkForge/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["markforge*"]

[tool.setuptools.package-data]
markforge = ["templates/*.html", "themes/*.css"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
